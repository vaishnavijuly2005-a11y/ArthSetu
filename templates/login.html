{% extends "base.html" %}
{% block title %}Log in · ArthSetu{% endblock %}
{% block content %}
<div class="auth-card card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to see your finances.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus value="{{ request.form.get('email', '') }}">
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <label class="check"><input type="checkbox" name="remember"> Remember me</label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p class="muted center">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
